# Бот ВК запускается отдельно от Compose Chat API.
# Redis остаётся у Chat API. События бот читает по WebSocket того же API.

name: dating-bot-vk

services:
  bot:
    image: ${BOT_IMAGE:-dating-bot:local}
    build: .
    container_name: vk-bot
    restart: unless-stopped
    environment:
      VK_TOKEN: ${VK_TOKEN:-}
      VK_TOKENS: ${VK_TOKENS:-}
      CHAT_API_SERVICE_TOKEN: ${CHAT_API_SERVICE_TOKEN:?Задайте CHAT_API_SERVICE_TOKEN в .env}
      CHAT_API_URL: ${CHAT_API_URL:-https://api.chatwithyou.site}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-}
