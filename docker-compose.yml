# Бот ВК. Chat API и Redis живут в репозитории Chat API.
# Общая сеть задаётся CHAT_NETWORK: бот ходит на http://chat-api:8000 и redis://redis:6379/0.
# Локально: сначала поднять Chat API, затем docker compose up --build

name: dating-bot-vk

services:
  bot:
    image: ${BOT_IMAGE:-dating-bot:local}
    build: .
    container_name: vk-bot
    restart: unless-stopped
    environment:
      VK_TOKEN: ${VK_TOKEN:-}
      VK_TOKENS: ${VK_TOKENS:-}
      CHAT_API_SERVICE_TOKEN: ${CHAT_API_SERVICE_TOKEN:?Задайте CHAT_API_SERVICE_TOKEN в .env}
      CHAT_API_URL: ${CHAT_API_URL:-http://chat-api:8000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    networks:
      - chat

networks:
  chat:
    external: true
    name: ${CHAT_NETWORK:?Задайте CHAT_NETWORK — сеть Docker Compose Chat API}
