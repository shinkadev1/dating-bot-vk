name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - .github/workflows/deploy.yml

concurrency:
  group: deploy-vk-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=0
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "Добавьте секрет $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          user=$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
          echo "bot_image=${user}/dating-bot:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.images.outputs.bot_image }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,scope=bot,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "Добавьте секрет $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Encode env file
        id: envfile
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          b64=$(printf '%s' "$ENV_FILE" | base64 -w 0)
          echo "::add-mask::$b64"
          echo "b64=$b64" >> "$GITHUB_OUTPUT"

      - name: Update VK bot
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          CHAT_APP_DIR: ${{ secrets.CHAT_APP_DIR }}
          ENV_FILE_B64: ${{ steps.envfile.outputs.b64 }}
          GIT_SHA: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          envs: DEPLOY_PATH,CHAT_APP_DIR,ENV_FILE_B64,GIT_SHA,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -eu
            APP_DIR="${DEPLOY_PATH:-${HOME}/dating-bot-vk}"
            hub_user=$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
            export BOT_IMAGE="${hub_user}/dating-bot:${GIT_SHA}"
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$(dirname "$APP_DIR")"
              git clone https://github.com/aStormspirit/dating-bot-vk.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git remote set-url origin https://github.com/aStormspirit/dating-bot-vk.git
            git fetch origin "$GIT_SHA"
            git checkout --detach --force "$GIT_SHA"
            sh deploy/update.sh
